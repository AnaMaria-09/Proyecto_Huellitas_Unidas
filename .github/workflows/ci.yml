name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verificar:
    name: Lint, build y pruebas
    runs-on: ubuntu-latest

    # Valores de ejemplo SOLO para la CI (igual que .env.test.example). No son secretos reales
    # ni se usan en producción. Las pruebas e2e los leen del entorno porque aquí no hay .env.test.
    env:
      PORT: 3100
      NODE_ENV: test
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: huellitas_unidas_test
      POSTGRES_USER: huellitas
      POSTGRES_PASSWORD: huellitas-ci
      JWT_SECRET: secreto-de-prueba-para-ci-no-usar-en-produccion
      CORS_ORIGINS: http://localhost:4200
      ADMIN_EMAIL: admin-e2e@huellitas.local
      ADMIN_PASSWORD: admin-de-prueba-para-ci
      ALMACENAMIENTO_DIR: uploads-test
      URL_FIRMADA_SECRETO: secreto-de-urls-firmadas-de-prueba-para-ci
      LIMITE_PETICIONES_POR_MINUTO: 10000
      LIMITE_AUTENTICACION_POR_MINUTO: 10000

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: huellitas
          POSTGRES_PASSWORD: huellitas-ci
          POSTGRES_DB: huellitas_unidas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U huellitas"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Configurar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Pruebas unitarias
        run: npm run test

      - name: Migraciones en la base de pruebas
        run: npm run migration:run

      # Compila, levanta la API en PORT contra la base de pruebas y la detiene al terminar.
      - name: Pruebas end-to-end
        run: npm run test:e2e
